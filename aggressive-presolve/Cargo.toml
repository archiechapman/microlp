[package]
name = "aggressive-presolve"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"
authors = ["Archie Chapman <archiechapman@gmail.com>"]
license = "Apache-2.0"
description = "Aggressive MILP presolve with postsolve and a checked fallback, around microlp."
publish = false

[dependencies]
microlp = { path = ".." }
flate2 = "1.1.9"

[dev-dependencies]
# Only for examples/suite.rs, which compiles microlp's correctness-suite
# generators (tests/suite) in unchanged through #[path].
mps = { version = "1.0.1", default-features = false }
lp_parser_rs = "4.1.0"
bit-set = { version = "0.11.1", default-features = false }

[profile.test]
opt-level = 3

# Standalone: not a member of microlp's workspace.
[workspace]
